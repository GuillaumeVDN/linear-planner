repos:
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript type check
        entry: npx tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
      - id: build
        name: Production build (tsc -b + vite build)
        entry: npm run build
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
